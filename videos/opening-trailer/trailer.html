<!doctype html>
<html><head><meta charset="utf-8">
<!-- Champion opening trailer renderer: draw(t) paints one frame of the 1920x1080 trailer on the canvas.
     Timings come from build/timings.json (voice-over fragments, hits, logo slam). Real logo / trophy from ../../brand. -->
<style>
@font-face{font-family:Orbitron;font-weight:900;src:url(../../node_modules/@fontsource/orbitron/files/orbitron-latin-900-normal.woff2)}
@font-face{font-family:Orbitron;font-weight:700;src:url(../../node_modules/@fontsource/orbitron/files/orbitron-latin-700-normal.woff2)}
@font-face{font-family:Rajdhani;font-weight:700;src:url(../../node_modules/@fontsource/rajdhani/files/rajdhani-latin-700-normal.woff2)}
@font-face{font-family:'Tiro Bangla';font-weight:400;src:url(../../node_modules/@fontsource/tiro-bangla/files/tiro-bangla-bengali-400-normal.woff2);unicode-range:U+0951-0952,U+0964-0965,U+0980-09FE,U+1CD0,U+1CD5-1CD6,U+1CD8,U+1CE1,U+1CEA,U+1CED,U+1CF2,U+1CF5-1CF7,U+200C-200D,U+25CC,U+A8F1}
@font-face{font-family:'Tiro Bangla';font-weight:400;src:url(../../node_modules/@fontsource/tiro-bangla/files/tiro-bangla-latin-400-normal.woff2);unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
html,body{margin:0;background:#000}canvas{display:block}
</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080, CX = W / 2, CY = H / 2;
const c = document.getElementById('c'), g = c.getContext('2d');
const BLUE = '#2B83F6', LIGHT = '#4DA3FF', DEEP = '#1F6FE5', SKY = '#6BB8FF';
let TM, IMG = {}, NOISE = [];
const Q = new URLSearchParams(location.search), LANG = Q.get('lang') || 'en', BUILD = LANG === 'en' ? 'build' : 'build_' + LANG;
const BN = {
  'CUMILLA': 'কুমিল্লা', 'YOUR GAME HAS BEEN WAITING': 'তোমার খেলা অপেক্ষা করছে', 'BIG SCREENS': 'বিশাল স্ক্রিন',
  'REAL RIVALS': 'আসল প্রতিদ্বন্দ্বী', 'PLAYSTATION': 'প্লেস্টেশন', '& PC GAMING': 'আর পিসি গেমিং', 'FLOOR': 'তলা',
  'A NEW ARENA RISES': 'জেগে উঠছে নতুন এরিনা', '4TH FLOOR': 'চারতলা', 'IFIC BANK BUILDING · RANIR BAZAR': 'আইএফআইসি ব্যাংক ভবন · রানীর বাজার',
  'BRING YOUR SQUAD': 'দলবল নিয়ে এসো', 'JOIN THE': 'যোগ দাও', 'ARENA': 'এরিনায়', 'CLIMB THE RANKS': 'উঠে যাও শীর্ষে',
  'BUT ONLY ONE...': 'কিন্তু একজনই...', 'WILL BE THE CHAMPION': 'হবে চ্যাম্পিয়ন', 'GRAND OPENING': 'শুভ উদ্বোধন', 'NOVEMBER': 'নভেম্বর',
  'AM': 'সকাল', 'GRAND OPENING  ·  25 NOVEMBER  ·  10:00 AM': 'শুভ উদ্বোধন  ·  ২৫ নভেম্বর  ·  সকাল ১০টা',
  'BOOK NOW: champion.gemten.com.bd': 'বুকিং: champion.gemten.com.bd',
  'IFIC BANK BUILDING (4TH FLOOR) · RANIR BAZAR · CUMILLA': 'আইএফআইসি ব্যাংক ভবন (৪র্থ তলা) · রানীর বাজার · কুমিল্লা',
  'GAME ON': 'শুরু হোক খেলা!' };
const L = s => (LANG === 'bn' && BN[s]) ? BN[s] : s;
const isBn = s => /[\u0980-\u09FF]/.test(s);
const bnDigits = s => s.replace(/[0-9]/g, d => '০১২৩৪৫৬৭৮৯'[d]);
let WR = [0, 1], WD = [0, 1];
function warp(t) {            // real time -> design time (piecewise linear)
  for (let i = 1; i < WR.length; i++) if (t <= WR[i]) return WD[i - 1] + (t - WR[i - 1]) * (WD[i] - WD[i - 1]) / Math.max(1e-6, WR[i] - WR[i - 1]);
  return WD[WD.length - 1] + (t - WR[WR.length - 1]);
}
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const p = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3), ei = x => x * x * x, eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function rnd(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

async function init() {
  TM = await (await fetch(BUILD + '/timings.json')).json();
  const w = TM.warp || [[0, 0], [TM.total, TM.total]]; WR = w.map(a => a[0]); WD = w.map(a => a[1]);
  const load = (k, src) => new Promise(r => { const i = new Image(); i.onload = () => { IMG[k] = i; r(); }; i.src = src; });
  await Promise.all([
    load('wordmark', '../../brand/wordmark-white-gradient-trophy.png'),
    load('logo', '../../brand/logo-white-gradient-trophy.png'),
    load('trophy', '../../brand/trophy-gradient.png'),
    document.fonts.load('900 40px Orbitron'), document.fonts.load("400 40px 'Tiro Bangla'", 'কখগ'), document.fonts.load('700 40px Orbitron'), document.fonts.load('700 40px Rajdhani')]);
  const R = rnd(99);
  for (let k = 0; k < 4; k++) {           // film grain tiles
    const n = document.createElement('canvas'); n.width = n.height = 256; const nx = n.getContext('2d');
    const d = nx.createImageData(256, 256);
    for (let i = 0; i < d.data.length; i += 4) { const v = R() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
    nx.putImageData(d, 0, 0); NOISE.push(n);
  }
  window.READY = true;
}
const DES = () => TM.design || TM.vo;
const S = k => DES()[k].start, E = k => DES()[k].end;

// ---------- helpers
function text(s, x, y, size, { font = 'Orbitron', w = 900, fill = '#fff', ls = 0, align = 'center', alpha = 1, glow = 0, glowColor = LIGHT, stroke = null, sw = 2 } = {}) {
  s = L(s);
  if (LANG === 'bn' && !/[A-Za-z]/.test(s)) s = bnDigits(s);
  const bn = isBn(s);
  if (bn) { font = "'Tiro Bangla'"; w = 400; ls = Math.min(ls, 4); size *= 1.05; }
  g.save(); g.globalAlpha *= alpha; g.font = `${w} ${size}px ${font}`; g.letterSpacing = ls + 'px';
  g.textAlign = align; g.textBaseline = 'middle';
  if (glow) { g.shadowColor = glowColor; g.shadowBlur = glow; }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = sw; g.strokeText(s, x, y); }
  if (bn && fill) { g.strokeStyle = fill; g.lineWidth = Math.max(1.5, size * 0.035); g.lineJoin = 'round'; g.strokeText(s, x, y); g.shadowBlur = 0; }
  if (fill) { g.fillStyle = fill; g.fillText(s, x, y); }
  g.restore();
}
function glitchText(s, x, y, size, age, opts = {}) {      // RGB split + slice jitter for the first moments
  const k = clamp(1 - age / 0.35);
  if (k > 0) {
    const R = rnd(Math.floor(age * 60) + s.length * 13);
    text(s, x - 10 * k * (R() + .3), y, size, { ...opts, fill: 'rgba(255,40,80,0.75)', glow: 0 });
    text(s, x + 10 * k * (R() + .3), y, size, { ...opts, fill: 'rgba(0,220,255,0.75)', glow: 0 });
  }
  text(s, x + (k ? (Math.random() - .5) * 6 * k : 0), y, size, opts);
}
function slam(age, from = 1.6) { const q = eo(clamp(age / 0.22)); return { s: from + (1 - from) * q, a: clamp(age / 0.08) }; }
function rays(x, y, n, len, alpha, rot, color = '255,255,255', width = 0.07) {
  g.save(); g.translate(x, y); g.rotate(rot); g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2;
    const gr = g.createLinearGradient(0, 0, Math.cos(a) * len, Math.sin(a) * len);
    gr.addColorStop(0, `rgba(${color},${alpha})`); gr.addColorStop(1, `rgba(${color},0)`);
    g.fillStyle = gr; g.beginPath(); g.moveTo(0, 0);
    g.lineTo(Math.cos(a - width) * len, Math.sin(a - width) * len); g.lineTo(Math.cos(a + width) * len, Math.sin(a + width) * len);
    g.closePath(); g.fill();
  }
  g.restore();
}
function radial(x, y, r, color, a) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(${color},${a})`); gr.addColorStop(1, `rgba(${color},0)`);
  g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
}
function flare(x, y, w, a) {          // anamorphic horizontal lens flare
  g.save(); g.globalCompositeOperation = 'lighter';
  const gr = g.createLinearGradient(x - w, 0, x + w, 0);
  gr.addColorStop(0, 'rgba(77,163,255,0)'); gr.addColorStop(.5, `rgba(170,215,255,${a})`); gr.addColorStop(1, 'rgba(77,163,255,0)');
  g.fillStyle = gr; g.fillRect(x - w, y - 3, w * 2, 6);
  g.fillStyle = gr; g.globalAlpha = .35; g.fillRect(x - w, y - 14, w * 2, 28);
  radial(x, y, 160, '160,210,255', a * .8);
  g.restore();
}
function sparks(t, t0, x, y, n, seed, spread = 900, life = 1.6) {
  const age = t - t0; if (age < 0 || age > life) return;
  const R = rnd(seed); g.save(); g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const a = R() * Math.PI * 2, v = (0.3 + R() * 0.7) * spread, l = (0.4 + R() * 0.6) * life;
    if (age > l) continue;
    const q = age / l, d = v * eo(q), px = x + Math.cos(a) * d, py = y + Math.sin(a) * d + 120 * q * q;
    g.strokeStyle = `rgba(${R() > .5 ? '120,190,255' : '255,255,255'},${(1 - q) * 0.9})`; g.lineWidth = 2 + R() * 2;
    g.beginPath(); g.moveTo(px, py); g.lineTo(px - Math.cos(a) * 26 * (1 - q), py - Math.sin(a) * 26 * (1 - q)); g.stroke();
  }
  g.restore();
}
function embers(t, n, seed, alpha = .6) {
  const R = rnd(seed); g.save(); g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const x0 = R() * W, sp = 20 + R() * 60, ph = R() * 50, sz = 1 + R() * 3;
    const y = H - ((t * sp + ph * 20) % (H + 100)), x = x0 + Math.sin(t * .7 + ph) * 30;
    g.fillStyle = `rgba(120,190,255,${alpha * (0.3 + R() * 0.7)})`; g.beginPath(); g.arc(x, y, sz, 0, 7); g.fill();
  }
  g.restore();
}
function grid(t, alpha, horizonY = 700, speed = 1) {
  g.save(); g.strokeStyle = `rgba(43,131,246,${alpha})`; g.lineWidth = 2;
  for (let i = -20; i <= 20; i++) { g.beginPath(); g.moveTo(CX + i * 6, horizonY); g.lineTo(CX + i * 160, H); g.stroke(); }
  for (let k = 0; k < 14; k++) {
    const z = ((k + (t * speed) % 1) / 14); const y = horizonY + (H - horizonY) * z * z;
    g.globalAlpha = z; g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
  }
  g.restore();
}
function speedLines(t, alpha, seed) {
  const R = rnd(seed); g.save(); g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 60; i++) {
    const y = R() * H, len = 200 + R() * 700, sp = 2500 + R() * 2500, x = W - ((t * sp + R() * 4000) % (W + len * 2));
    g.strokeStyle = `rgba(77,163,255,${alpha * (0.2 + R() * 0.5)})`; g.lineWidth = 1 + R() * 3;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + len, y); g.stroke();
  }
  g.restore();
}
function psSym(kind, x, y, r, color, lw, alpha = 1, rot = 0) {
  g.save(); g.globalAlpha *= alpha; g.translate(x, y); g.rotate(rot); g.strokeStyle = color; g.lineWidth = lw; g.lineJoin = g.lineCap = 'round';
  g.beginPath();
  if (kind === 'tri') { g.moveTo(0, -r * .85); g.lineTo(r * .86, r * .6); g.lineTo(-r * .86, r * .6); g.closePath(); }
  if (kind === 'cir') g.arc(0, 0, r * .78, 0, 7);
  if (kind === 'x') { g.moveTo(-r * .65, -r * .65); g.lineTo(r * .65, r * .65); g.moveTo(r * .65, -r * .65); g.lineTo(-r * .65, r * .65); }
  if (kind === 'sq') g.rect(-r * .68, -r * .68, r * 1.36, r * 1.36);
  g.stroke(); g.restore();
}
function controller(x, y, s, alpha) {       // generic gamepad line icon
  g.save(); g.globalAlpha *= alpha; g.translate(x, y); g.scale(s, s); g.strokeStyle = '#fff'; g.lineWidth = 9 / s * s; g.lineJoin = g.lineCap = 'round';
  g.lineWidth = 9;
  g.beginPath(); g.moveTo(-170, -130); g.bezierCurveTo(-90, -146, 90, -146, 170, -130); g.bezierCurveTo(230, -118, 262, -70, 272, -10);
  g.bezierCurveTo(284, 60, 300, 140, 262, 172); g.bezierCurveTo(228, 200, 176, 186, 150, 150); g.bezierCurveTo(120, 108, 90, 84, 0, 84);
  g.bezierCurveTo(-90, 84, -120, 108, -150, 150); g.bezierCurveTo(-176, 186, -228, 200, -262, 172); g.bezierCurveTo(-300, 140, -284, 60, -272, -10);
  g.bezierCurveTo(-262, -70, -230, -118, -170, -130); g.closePath(); g.stroke();
  g.beginPath(); g.moveTo(-172, -84); g.lineTo(-172, 12); g.moveTo(-220, -36); g.lineTo(-124, -36); g.stroke();
  psSym('tri', 172, -78, 22, '#fff', 7); psSym('cir', 214, -36, 22, '#fff', 7); psSym('x', 172, 6, 22, '#fff', 7); psSym('sq', 130, -36, 22, '#fff', 7);
  g.beginPath(); g.arc(-84, 38, 30, 0, 7); g.moveTo(114, 38); g.arc(84, 38, 30, 0, 7); g.stroke();
  g.restore();
}
function player(x, y, s, color, alpha = 1) {
  g.save(); g.globalAlpha *= alpha; g.fillStyle = color;
  g.beginPath(); g.arc(x, y - 30 * s, 24 * s, 0, 7); g.fill();
  g.beginPath(); g.moveTo(x - 46 * s, y + 46 * s); g.quadraticCurveTo(x - 46 * s, y - 2 * s, x, y - 2 * s); g.quadraticCurveTo(x + 46 * s, y - 2 * s, x + 46 * s, y + 46 * s); g.closePath(); g.fill();
  g.restore();
}
function img(k, x, y, w, alpha = 1, { glow = 0, glowColor = LIGHT } = {}) {
  const i = IMG[k], h = w * i.height / i.width;
  g.save(); g.globalAlpha *= alpha; if (glow) { g.shadowColor = glowColor; g.shadowBlur = glow; }
  g.drawImage(i, x - w / 2, y - h / 2, w, h); g.restore(); return h;
}
function sheen(k, x, y, w, pos, alpha) {    // light sweep across an image (masked to its alpha)
  const i = IMG[k], h = w * i.height / i.width;
  const o = document.createElement('canvas'); o.width = Math.ceil(w); o.height = Math.ceil(h); const ox = o.getContext('2d');
  ox.drawImage(i, 0, 0, w, h); ox.globalCompositeOperation = 'source-in';
  const gx = pos * (w * 1.6) - w * 0.3; const gr = ox.createLinearGradient(gx - 140, 0, gx + 140, h * .3);
  gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(.5, `rgba(255,255,255,${alpha})`); gr.addColorStop(1, 'rgba(255,255,255,0)');
  ox.fillStyle = gr; ox.fillRect(0, 0, w, h);
  g.save(); g.globalCompositeOperation = 'lighter'; g.drawImage(o, x - w / 2, y - h / 2); g.restore();
}

// ---------- the frame
function draw(treal) {
  const t = warp(treal);
  const LOGO = TM.logo, hits = TM.hits;
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  // background
  const bg = g.createRadialGradient(CX, CY * 0.9, 50, CX, CY, 1200);
  bg.addColorStop(0, '#0B1E46'); bg.addColorStop(.55, '#06102A'); bg.addColorStop(1, '#020409');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  // camera shake from hits
  let sx = 0, sy = 0;
  for (const h of [...hits, LOGO]) { const a = t - h; if (a > 0 && a < 0.6) { const k = Math.exp(-a * 9) * (h === LOGO ? 26 : 14); sx += Math.sin(a * 90) * k; sy += Math.cos(a * 77) * k; } }
  const zoom = 1 + 0.02 * Math.sin(t * 0.4);
  g.setTransform(zoom, 0, 0, zoom, CX * (1 - zoom) + sx, CY * (1 - zoom) + sy);

  // ===== S0 0 - 3.9 : darkness, light line, CUMILLA
  if (t < 3.95) {
    const a = 1 - p(t, 3.6, 3.95);
    g.save(); g.globalAlpha = a;
    embers(t, 60, 3, .45 * p(t, 0, 1.5));
    const lw = eo(p(t, 0.3, 1.3)) * 1500;
    flare(CX, CY + 70, lw / 2, 0.9 * p(t, 0.3, 0.8));
    if (t > S('A1') - .1) glitchText('CUMILLA', CX, CY - 30, 150, t - S('A1') + .1, { ls: 40 * (1 + .1 * p(t, 1, 3.9)), glow: 30, alpha: p(t, S('A1') - .1, S('A1') + .2) });
    if (t > S('A2')) text('YOUR GAME HAS BEEN WAITING', CX, CY + 140, 42, { font: 'Rajdhani', w: 700, ls: 16, fill: '#C9D6EA', alpha: p(t, S('A2'), S('A2') + .5) });
    g.restore();
  }
  // ===== S1 3.9 - 7.8 : trophy reveal
  if (t > 3.85 && t < 8.0) {
    const age = t - 3.9, a = p(t, 3.85, 4.1) * (1 - p(t, 7.7, 8.0));
    g.save(); g.globalAlpha = a;
    radial(CX, CY, 700, '43,131,246', .35);
    rays(CX, CY - 40, 18, 1300, .12, age * .08);
    grid(t, .25, 760, .4);
    const s = 0.88 + 0.12 * eio(p(t, 3.9, 7.8));
    const w = 330 * s;
    img('trophy', CX, CY - 20, w, eo(p(t, 3.9, 4.6)), { glow: 60 });
    sheen('trophy', CX, CY - 20, w, p(t, 4.4, 6.0), .65);
    flare(CX, CY - 20, 700 * eo(p(t, 3.9, 4.3)) * (1 - .6 * p(t, 4.3, 6)), .7);
    embers(t, 80, 5, .55);
    g.restore();
  }
  // ===== S2 7.8 - 13.6 : action cuts
  if (t > 7.75 && t < 13.65) {
    const a = p(t, 7.75, 7.9) * (1 - p(t, 13.45, 13.65));
    g.save(); g.globalAlpha = a;
    speedLines(t, .9, 11);
    if (t < S('B2') - .05) {                       // BIG SCREENS
      const age = t - (S('B1') - .05), m = slam(age);
      g.save(); g.translate(CX, CY); g.scale(m.s, m.s);
      const fw = 1100 * eo(p(age, 0, .35)), fh = 560 * eo(p(age, .05, .4));
      g.strokeStyle = LIGHT; g.lineWidth = 6; g.shadowColor = LIGHT; g.shadowBlur = 30; g.strokeRect(-fw / 2, -fh / 2 - 20, fw, fh);
      g.fillStyle = 'rgba(43,131,246,0.12)'; g.fillRect(-fw / 2, -fh / 2 - 20, fw, fh);
      g.fillStyle = '#1A2233'; g.fillRect(-60, fh / 2 - 20, 120, 14 * p(age, .2, .4)); g.restore();
      glitchText('BIG SCREENS', CX, CY - 20, 150, age, { glow: 30, alpha: m.a });
    } else if (t < S('B3') - .05) {                 // REAL RIVALS
      const age = t - (S('B2') - .05), m = slam(age);
      g.save(); g.globalCompositeOperation = 'lighter';
      g.fillStyle = 'rgba(43,131,246,.18)'; g.beginPath(); g.moveTo(0, 0); g.lineTo(CX + 120, 0); g.lineTo(CX - 120, H); g.lineTo(0, H); g.fill(); g.restore();
      text('P1', CX - 520 - 200 * (1 - eo(p(age, 0, .3))), CY, 260, { fill: SKY, alpha: m.a, glow: 40 });
      text('P2', CX + 520 + 200 * (1 - eo(p(age, 0, .3))), CY, 260, { fill: '#fff', alpha: m.a, glow: 40 });
      g.save(); g.translate(CX, CY); g.scale(m.s, m.s); text('VS', 0, 0, 120, { fill: '#fff', glow: 50, glowColor: '#fff' }); g.restore();
      glitchText('REAL RIVALS', CX, CY + 250, 80, age, { ls: 18, alpha: p(age, .1, .3) });
    } else {                                        // PLAYSTATION & PC GAMING
      const age = t - (S('B3') - .05), m = slam(age, 1.4);
      const syms = ['tri', 'cir', 'x', 'sq'];
      for (let i = 0; i < 4; i++) {
        const px = [-1, 1, -1, 1][i], py = [-1, -1, 1, 1][i], e = eo(p(age, 0, .4));
        psSym(syms[i], CX + px * (380 + 300 * e), CY - 40 + py * (150 + 60 * e) + 14 * Math.sin(age * 3 + i), 70, LIGHT, 10, .9 * e, age * .5 * px);
      }

  if (t > 13.55 && t < 18.45) {

      g.save(); g.translate(CX, py); g.fillStyle = BLUE; g.shadowColor = LIGHT; g.shadowBlur = 40;
      g.beginPath(); g.arc(0, -40, 60, Math.PI, 0); g.quadraticCurveTo(60, 10, 0, 100); g.quadraticCurveTo(-60, 10, -60, -40); g.fill();
      g.fillStyle = '#06102A'; g.shadowBlur = 0; g.beginPath(); g.arc(0, -40, 24, 0, 7); g.fill(); g.restore();

  // ===== S4 18.4 - 22.8 : squad / arena / ranks
  if (t > 18.35 && t < 22.85) {
    const a = p(t, 18.35, 18.5) * (1 - p(t, 22.6, 22.85));

    speedLines(t, .5, 31); radial(CX, CY, 800, '43,131,246', .25);
    const d1 = S('D1') - .05, d2 = S('D2') - .05, d3 = S('D3') - .05;
    if (t < d2) {
      const age = t - d1, cols = [SKY, '#fff', LIGHT, '#C9D3E0'];
      for (let i = 0; i < 4; i++) { const on = p(age, .05 + i * .12, .2 + i * .12); player(CX - 390 + i * 260, CY - 80, 2.0, cols[i], .25 + .75 * on); text('P' + (i + 1), CX - 390 + i * 260, CY + 60, 40, { fill: cols[i], alpha: on }); }
      const m = slam(age, 1.4); g.save(); g.translate(CX, CY + 220); g.scale(m.s, m.s); glitchText('BRING YOUR SQUAD', 0, 0, 100, age, { glow: 30, alpha: m.a }); g.restore();
    } else if (t < d3) {
      const age = t - d2;
      g.save(); g.translate(CX, CY - 40); g.globalCompositeOperation = 'lighter';
      for (let k = 0; k < 3; k++) { g.strokeStyle = `rgba(77,163,255,${.6 - k * .15})`; g.lineWidth = 6 - k; g.beginPath(); g.ellipse(0, 0, (300 + k * 120) * eo(p(age, 0, .4)), (300 + k * 120) * .32 * eo(p(age, 0, .4)), 0, 0, 7); g.stroke(); }
      g.restore(); rays(CX, CY - 40, 14, 900, .14, age * .3);
      const m = slam(age, 1.6); g.save(); g.translate(CX, CY - 40); g.scale(m.s, m.s); text('JOIN THE', 0, LANG === 'bn' ? -190 : -140, 64, { w: 700, ls: 20, fill: SKY, alpha: m.a }); glitchText('ARENA', 0, 30, 220, age, { glow: 50, alpha: m.a }); g.restore();
    } else {
      const age = t - d3;
      for (let k = 0; k < 5; k++) {        // rank chevrons stacking up

    }

  }
  // ===== S5 22.8 - LOGO : tension
  if (t > 22.8 && t < LOGO + .05) {
    const a = p(t, 22.8, 23.1);
    g.save(); g.globalAlpha = a;
    const beat = Math.max(Math.exp(-Math.max(0, t - (S('E1') - .2)) * 6) * (t > S('E1') - .2), Math.exp(-Math.max(0, t - (S('E1') + .75)) * 6) * (t > S('E1') + .75));

    // converging light streaks into the centre
    const q = p(t, S('E2'), LOGO);
    if (q > 0) {
      g.save(); g.globalCompositeOperation = 'lighter';

      for (let i = 0; i < 70; i++) { const ang = R() * Math.PI * 2, d0 = 1300 * (1 - ei(q)) + 30, len = 120 + 400 * q; g.strokeStyle = `rgba(150,205,255,${.15 + .6 * q})`; g.lineWidth = 2 + 3 * q; g.beginPath(); g.moveTo(CX + Math.cos(ang) * d0, CY + Math.sin(ang) * d0); g.lineTo(CX + Math.cos(ang) * (d0 + len), CY + Math.sin(ang) * (d0 + len)); g.stroke(); }

    rays(CX, CY, 24, 1500, .16 * Math.exp(-age * .5) + .05, age * .05);
    for (let k = 0; k < 2; k++) { const ra = p(age - k * .12, 0, 1.1); if (ra > 0 && ra < 1) { g.save(); g.strokeStyle = `rgba(160,210,255,${(1 - ra) * .9})`; g.lineWidth = 10 * (1 - ra) + 1; g.beginPath(); g.ellipse(CX, CY, 100 + ra * 1100, (100 + ra * 1100) * .42, 0, 0, 7); g.stroke(); g.restore(); } }
    sparks(t, LOGO, CX, CY, 160, 5, 1100, 1.8);
    const s = 1 + 0.35 * (1 - eo(p(age, 0, .18))) + 0.04 * p(age, .2, 3.3);

  }
  // ===== S7 29.7 - 35.6 : grand opening / date / time
  if (t > 29.7 && t < 35.75) {

      g.fillStyle = 'rgba(11,30,70,.85)'; g.strokeStyle = LIGHT; g.lineWidth = 4; g.shadowColor = LIGHT; g.shadowBlur = 25;
      g.beginPath(); g.roundRect(-300, -62, 600, 124, 24); g.fill(); g.stroke(); g.shadowBlur = 0;
      const colon = (Math.floor(age * 2) % 2 === 0) ? ':' : ' ';

  if (t > 35.6) {

    if (t > S('G2') - .05) {

  }

  // ===== global finishing: flashes, letterbox, vignette, grain
  g.setTransform(1, 0, 0, 1, 0, 0);
  let fl = 0;
  for (const h of hits) { const a = t - h; if (a > 0) fl = Math.max(fl, .45 * Math.exp(-a * 14)); }
  { const a = t - LOGO; if (a > 0) fl = Math.max(fl, 1.0 * Math.exp(-a * 5)); }
  if (fl > 0.01) { g.fillStyle = `rgba(220,236,255,${fl})`; g.fillRect(0, 0, W, H); }
  const vg = g.createRadialGradient(CX, CY, 400, CX, CY, 1150); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.6)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  g.save(); g.globalAlpha = .06; g.globalCompositeOperation = 'overlay';
  const nz = NOISE[Math.floor(t * 30) % 4]; const ox = Math.floor((t * 977) % 256), oy = Math.floor((t * 613) % 256);
  for (let x = -ox; x < W; x += 256) for (let y = -oy; y < H; y += 256) g.drawImage(nz, x, y);
  g.restore();
  const bar = 108; g.fillStyle = '#000'; g.fillRect(0, 0, W, bar); g.fillRect(0, H - bar, W, bar);
  if (t < 0.6) { g.fillStyle = `rgba(0,0,0,${1 - t / 0.6})`; g.fillRect(0, 0, W, H); }
  if (treal > TM.total - 0.8) { g.fillStyle = `rgba(0,0,0,${(treal - TM.total + 0.8) / 0.8})`; g.fillRect(0, 0, W, H); }
}
