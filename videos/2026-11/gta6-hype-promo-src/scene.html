<script>
const W=1920,H=1080,FPS=30,DUR=54;
const q=new URLSearchParams(location.search);
const MODE=q.get('mode')||'A';          // A = original visuals, B = overlay for trailer footage
const OVERLAY = MODE==='B';
if(OVERLAY){document.body.classList.add('overlay');document.documentElement.classList.add('overlay');}
const FOOT0=4.6, FOOT1=19.6;            // footage window used by version B

// ---------- helpers ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,u)=>a+(b-a)*u;
const E={lin:u=>u,out:u=>1-Math.pow(1-u,3),inout:u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2,
  expo:u=>u>=1?1:1-Math.pow(2,-10*u),back:u=>{const c1=1.6,c3=c1+1;return 1+c3*Math.pow(u-1,3)+c1*Math.pow(u-1,2)}};
const P=(t,a,b,e=E.out)=>e(clamp((t-a)/(b-a)));
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const $=id=>document.getElementById(id);

// ---------- text timeline ----------
// a: blur | track | slam | up ; in/out = start of fade-in / start of fade-out ; words: per-word reveal times
const TXT=[
 // S1 cold open
 {html:'THE WAIT',cls:'cine',y:478,in:1.05,out:3.95,a:'track'},
 {html:'IS ALMOST OVER',cls:'cine',y:562,in:2.35,out:3.95,a:'track'},
 // S2 Vice City
 {html:'VICE CITY',cls:'xl glow-pink',y:262,in:5.66,out:9.95,a:'blur'},
 {html:'IS CALLING',cls:'cine',y:372,in:6.88,out:9.95,a:'track'},
 // S3 title + date
 {id:'gtaTitle',html:'<span class=w>GRAND</span> <span class=w>THEFT</span> <span class=w>AUTO</span> <span class=w style="font-size:1.2em">VI</span>',
   cls:'l glow-pink',y:470,in:11.08,out:18.85,a:'words',words:[11.08,11.46,11.82,12.2],moveTo:{t:13.4,y:385}},
 {html:'<span class=w>NOVEMBER</span> <span class="w grad-sun" style="font-size:1.35em">19</span><span class=w>,&nbsp;2026</span>',cls:'m',y:560,in:13.66,out:18.85,a:'words',words:[13.66,14.4,14.8]},
 {html:'ON PLAYSTATION 5',cls:'cine sm',y:672,in:15.9,out:18.85,a:'track'},
 // S4 big games deserve big screens
 {id:'bg1',html:'<span class=w>BIG</span> <span class=w>GAMES</span>',cls:'l glow-blue',y:330,in:20.08,out:24.15,a:'words',words:[20.08,20.46],fly:true},
 {id:'bg2',html:'DESERVE',cls:'cine',y:470,in:22.05,out:24.15,a:'track',fly:true},
 {id:'bg3',html:'<span class="w grad-blue">BIG</span> <span class="w grad-blue">SCREENS.</span>',cls:'xl',y:612,style:'font-size:124px',in:22.9,out:24.15,a:'words',words:[22.9,23.28],fly:true},
 // S5 setup
 {html:'<span class="w grad-blue">2×</span> <span class=w>PS5</span> <span class=w>STATIONS</span>',cls:'m',y:198,in:25.5,out:29.85,a:'words',words:[25.5,25.9,26.74]},
 {html:'<span class=w>55"</span> <span class=w>SCREENS</span>',cls:'cine blue',y:275,in:28.24,out:29.85,a:'words',words:[28.24,29.04]},
 {html:'<span class="w grad-blue">1</span> <span class=w>GAMING</span> <span class=w>PC</span>',cls:'m',y:198,in:30.85,out:34.6,a:'words',words:[30.85,30.9,31.32]},
 {html:'30" MONITOR',cls:'cine blue sm',y:270,in:31.6,out:34.6,a:'track'},
 // S6 logo
 {html:'GAMING ZONE',cls:'cine blue',y:600,in:37.34,out:40.15,a:'track'},
 {id:'loc',html:'<svg id=pin viewBox="0 0 24 24"><path d="M12 2C8 2 5 5 5 9c0 5 7 13 7 13s7-8 7-13c0-4-3-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z" fill="#4DA3FF"/></svg>IFIC BANK BUILDING (4TH FLOOR) &nbsp;·&nbsp; RANIR BAZAR &nbsp;·&nbsp; CUMILLA',
   cls:'cine sm',y:700,in:38.7,out:40.15,a:'up',style:'letter-spacing:.16em;font-size:38px'},
 // S7 CTA
 {html:'OPENING SOON',cls:'l grad-blue',y:330,in:41.06,out:44.75,a:'slam'},
 {html:'BOOK YOUR SLOT ONLINE',cls:'cine sm',y:488,in:42.68,out:44.75,a:'track'},
 {html:'PLAY',cls:'xl glow-blue',y:540,in:45.1,out:46.18,a:'slam',outDur:.18,style:'font-size:210px'},
 {html:'CONNECT',cls:'xl glow-blue',y:540,in:46.34,out:47.5,a:'slam',outDur:.18,style:'font-size:210px'},
 {html:'WIN',cls:'xl grad-blue',y:540,in:47.66,out:48.3,a:'slam',outDur:.3,style:'font-size:250px'},
 // S8 end card
 {html:'OPENING SOON &nbsp;·&nbsp; BOOK ONLINE: <span class=blue>champion.gemten.com.bd</span>',cls:'cine sm',y:520,in:48.95,out:53.3,a:'up',style:'letter-spacing:.14em;font-size:40px;text-transform:none'},
 {html:'IFIC Bank Building (4th Floor) &nbsp;·&nbsp; Ranir Bazar &nbsp;·&nbsp; Cumilla',cls:'cine sm',y:590,in:49.15,out:53.3,a:'up',style:'letter-spacing:.12em;font-size:32px;text-transform:none;color:#c9d4e6'},
];
const texts=$('texts');
TXT.forEach((it,i)=>{const d=document.createElement('div');d.className='txt '+it.cls;d.innerHTML=it.html;d.style.top=it.y+'px';
  if(it.style)d.style.cssText+=';'+it.style;texts.appendChild(d);it.el=d;it.ws=[...d.querySelectorAll('.w')];});

const LEGAL_A=`<b>Grand Theft Auto VI</b> is developed and published by <b>Rockstar Games</b>. Release date (19 November 2026) and platforms as announced by Rockstar Games.<br>
Grand Theft Auto, GTA and Rockstar Games are trademarks of Take-Two Interactive Software, Inc. PlayStation and PS5 are trademarks of Sony Interactive Entertainment Inc.<br>
CHAMPION Gaming Zone is not affiliated with, sponsored or endorsed by Rockstar Games, Take-Two Interactive or Sony Interactive Entertainment.<br>
All visuals, music and voice-over in this video are original.`;
const LEGAL_B=`<b>Grand Theft Auto VI</b> is developed and published by <b>Rockstar Games</b>. Release date (19 November 2026) and platforms as announced by Rockstar Games.<br>
Trailer footage: Grand Theft Auto VI Trailer 1 © Rockstar Games / Take-Two Interactive Software, Inc. All rights belong to their owners.<br>
Grand Theft Auto, GTA and Rockstar Games are trademarks of Take-Two Interactive Software, Inc. PlayStation and PS5 are trademarks of Sony Interactive Entertainment Inc.<br>
CHAMPION Gaming Zone is not affiliated with, sponsored or endorsed by Rockstar Games, Take-Two Interactive or Sony. Music and voice-over are original.`;
$('legalA').innerHTML = (q.get('legal')==='B') ? LEGAL_B : LEGAL_A;

function animText(it,t){
  const el=it.el, outDur=it.outDur||.45, dur=it.dur||.7;
  if(t<it.in-0.01||t>it.out+outDur){el.style.opacity=0;return;}
  const u=clamp((t-it.in)/dur), v=clamp((t-it.out)/outDur), live=t-it.in;
  let o=1,blur=0,sc=1,dy=0,ls=null;
  const fadeOut=1-E.inout(v);
  if(it.a==='blur'){o=E.out(u)*fadeOut;blur=16*(1-E.out(u))+10*v;sc=(1.08-.08*E.out(u))*(1+.012*live);}
  else if(it.a==='track'){o=E.out(u)*fadeOut;blur=8*(1-E.out(u))+6*v;ls=(it.el.classList.contains('sm')?.5:.5)+.45*(1-E.out(clamp(live/1.2)))+.02*live;}
  else if(it.a==='slam'){const s=clamp(live/.24);o=clamp(live/.07)*fadeOut;sc=(1+.55*(1-E.expo(s)))*(1+.01*live)*(1+.25*E.inout(v));blur=6*(1-s)+8*v;}
  else if(it.a==='up'){o=E.out(u)*fadeOut;dy=28*(1-E.out(u))-16*v;}
  else if(it.a==='words'){
    o=fadeOut; blur=8*v; sc=1+.012*live;
    it.ws.forEach((w,i)=>{const lw=t-it.words[i];if(lw<0){w.style.opacity=0;return;}
      const s=clamp(lw/.22);w.style.opacity=clamp(lw/.06);w.style.transform=`scale(${1+.6*(1-E.expo(s))})`;w.style.filter=`blur(${5*(1-s)}px)`;});
  }
  if(it.moveTo){dy+= (it.moveTo.y-it.y)*P(t,it.moveTo.t,it.moveTo.t+.8,E.inout);}
  if(it.fly){const f=P(t,it.out,it.out+outDur,E.inout);sc*=1+1.6*f;}
  el.style.opacity=o; el.style.filter=blur>0.05?`blur(${blur}px)`:'none';
  el.style.translate=`0 calc(-50% + ${dy}px)`; el.style.scale=sc;
  if(ls!==null) el.style.letterSpacing=ls+'em';
}

// ---------- canvas backgrounds ----------
const cv=$('bg'),ctx=cv.getContext('2d');
const R=rng(7);
const STARS=[...Array(160)].map(()=>({x:R()*W,y:R()*520,r:R()*1.6+.3,p:R()*6.28,s:R()*2+.5}));
const SKY1=(()=>{const r=rng(11),a=[];let x=-40;while(x<W+40){const w=30+r()*70;const center=Math.abs(x-W/2)/(W/2);const h=40+r()*90+ (center)*170*r();a.push({x,w,h,win:[...Array(30)].map(()=>[r(),r(),r()])});x+=w+r()*6;}return a;})();
const SKY2=(()=>{const r=rng(23),a=[];let x=-40;while(x<W+40){const w=40+r()*90;const h=70+r()*260*(.4+.6*r());a.push({x,w,h,neon:r()<.35,hue:r()<.5?'#ff3d9a':'#38e1ff',win:[...Array(60)].map(()=>[r(),r(),r()])});x+=w+r()*10;}return a;})();

function palm(c,x,base,h,lean,sway,col){

  c.moveTo(pts[0][0]-pts[0][2],pts[0][1]);pts.forEach(p=>c.lineTo(p[0]-p[2]/2,p[1]));
  for(let i=pts.length-1;i>=0;i--)c.lineTo(pts[i][0]+pts[i][2]/2,pts[i][1]);c.closePath();c.fill();
  // fronds
  const fr=[-2.9,-2.45,-2.0,-1.55,-1.1,-.7,-.25,.2];
  fr.forEach((a,i)=>{const L=h*(.42+.08*Math.sin(i*1.7));const ang=a+sway*.004;const ex=topX+Math.cos(ang)*L, ey=topY+Math.sin(ang)*L*.55+L*.38;

  });
}

    const x=W/2-wdt/2+Math.sin(t*1.3+i)*14;ctx.globalAlpha=.65*(1-i/50);ctx.fillStyle=i<14?'#ffc76b':'#ff5c8a';ctx.fillRect(x,y,wdt,2+i*.07);}

  palm(ctx,1760,1095,640,-140,Math.sin(t*.85+2)*10,'#120418');palm(ctx,1930,1100,760,-110,Math.sin(t*.7+3)*9,'#0d0312');

}

function grid(t,hz,col,speed,alpha){
  ctx.save();ctx.beginPath();ctx.rect(0,hz,W,H-hz);ctx.clip();
  ctx.strokeStyle=col;
  for(let i=-28;i<=28;i++){const xb=W/2+i*150;ctx.globalAlpha=alpha*.8;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W/2+i*6,hz);ctx.lineTo(xb*1.0+(xb-W/2)*1.8,H+40);ctx.stroke();}
  const ph=(t*speed)%1;
  for(let k=0;k<22;k++){const d=k+1-ph;const y=hz+520/d;if(y>H+10)continue;ctx.globalAlpha=alpha*clamp((y-hz)/120);ctx.lineWidth=1+3/d*1.6;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.restore();ctx.globalAlpha=1;
}

function night(t){

  ctx.save();ctx.translate(W/2,560);ctx.scale(push,push);ctx.translate(-W/2,-560);
  const hz=640;
  let g=ctx.createLinearGradient(0,0,0,hz);g.addColorStop(0,'#05031a');g.addColorStop(.6,'#1c0a3a');g.addColorStop(1,'#4a1050');ctx.fillStyle=g;ctx.fillRect(-100,-100,W+200,hz+100);
  STARS.forEach(s=>{ctx.globalAlpha=.35+.35*Math.sin(t*s.s+s.p);ctx.fillStyle='#fff';ctx.fillRect(s.x,s.y*.9,s.r,s.r)});ctx.globalAlpha=1;
  let rg=ctx.createRadialGradient(W/2,hz,20,W/2,hz,900);rg.addColorStop(0,'rgba(255,60,150,.55)');rg.addColorStop(.5,'rgba(120,30,160,.25)');rg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=rg;ctx.fillRect(-100,0,W+200,hz);

    if(b.neon){ctx.strokeStyle=b.hue;ctx.lineWidth=2;ctx.shadowColor=b.hue;ctx.shadowBlur=14;ctx.strokeRect(b.x+.5,hz-b.h+.5,b.w-1,6);ctx.shadowBlur=0;}
    b.win.forEach(w=>{if(w[2]<.62)return;const on=Math.sin(t*.7+w[0]*40)>-0.9;if(!on)return;ctx.fillStyle=w[2]>.9?'rgba(56,225,255,.8)':'rgba(255,200,140,.7)';ctx.fillRect(b.x+4+Math.floor(w[0]*(b.w-10)/8)*8,hz-b.h+12+Math.floor(w[1]*(b.h-20)/10)*10,4,5);});});
  // floor
  let fg=ctx.createLinearGradient(0,hz,0,H);fg.addColorStop(0,'#2a0838');fg.addColorStop(1,'#07020f');ctx.fillStyle=fg;ctx.fillRect(-100,hz,W+200,H);
  grid(t,hz,'#ff3d9a',1.1,.75);

  for(let i=0;i<14;i++){const r=rng(700+i);const dir=r()<.5?1:-1;const sp=500+r()*700;const len=120+r()*260;const y=hz+4+r()*10;

  ctx.restore();

function blueRoom(t,hz,gridA,speed){
  const hk=Math.min(hz/H,.998);
  let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#03060d');g.addColorStop(hk,'#0a1a3a');g.addColorStop(hk+.001,'#050c1c');g.addColorStop(1,'#02040a');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  let rg=ctx.createRadialGradient(W/2,hz,30,W/2,hz,1000);rg.addColorStop(0,'rgba(43,131,246,.45)');rg.addColorStop(1,'rgba(43,131,246,0)');ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);

}
function particles(t,alpha,col='77,163,255'){
  PARTS.forEach(p=>{const y=((p.y-t*p.s*p.z)%H+H)%H;const x=p.x+Math.sin(t*.6+p.p)*20;const r=1.2+p.z*1.6;ctx.globalAlpha=alpha*(.3+.5*p.z)*(.6+.4*Math.sin(t*3+p.p));
    ctx.fillStyle=`rgb(${col})`;ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fill();});ctx.globalAlpha=1;
}
function rays(t,a){
  ctx.save();ctx.translate(W/2,470);ctx.rotate(t*.06);
  for(let i=0;i<18;i++){ctx.rotate(Math.PI*2/18);const g=ctx.createLinearGradient(0,0,0,-1200);g.addColorStop(0,`rgba(77,163,255,${.16*a})`);g.addColorStop(1,'rgba(77,163,255,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-70,-1200);ctx.lineTo(70,-1200);ctx.closePath();ctx.fill();}
  ctx.restore();
}

function coldOpen(t){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  const a=P(t,.2,1.6,E.out)*(1-P(t,3.9,4.5,E.inout));const wd=1500*P(t,.2,3.6,E.out);
  let g=ctx.createLinearGradient(W/2-wd/2,0,W/2+wd/2,0);g.addColorStop(0,'rgba(77,163,255,0)');g.addColorStop(.5,`rgba(220,235,255,${a})`);g.addColorStop(1,'rgba(77,163,255,0)');
  ctx.fillStyle=g;ctx.fillRect(W/2-wd/2,519,wd,2);
  let rg=ctx.createRadialGradient(W/2,520,0,W/2,520,500);rg.addColorStop(0,`rgba(255,120,160,${.22*a})`);rg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);

function drawBG(t){
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  if(OVERLAY && t>=FOOT0 && t<FOOT1){ctx.clearRect(0,0,W,H);return;}
  if(t<4.6) coldOpen(t);
  else if(t<10.6) sunset(t);
  else if(t<19.6) night(t);
  else if(t<25.0){blueRoom(t,700,.35*P(t,19.7,20.6),.4);particles(t,.4);}
  else if(t<35.0){blueRoom(t,800,.7,.25);particles(t,.35);}
  else if(t<40.6){blueRoom(t,1080,0,0);rays(t,P(t,35.9,37,E.out));particles(t,.8);}
  else {blueRoom(t,t<48.6?860:905,.45,.3);particles(t,.6);if(t>47.6&&t<48.6)rays(t,P(t,47.66,47.9)*(1-P(t,48.2,48.6)));}
}

const tvs=[...document.querySelectorAll('.tv')];
function setupScene(t){

  [['st1',25.45],['st2',25.75]].forEach(([id,tt])=>{const e=$(id);const u=P(t,tt,tt+.5,E.back);e.style.opacity=clamp((t-tt)/.2);e.style.transform=`translateY(${40*(1-u)}px) scale(${.9+.1*u})`;});

  $('tower').style.setProperty('--rgb',`hsl(${(210+Math.sin(t*1.5)*40+ (t>32.68?120*Math.sin(t*3):0))|0} 95% 62%)`);

function screenFly(t){
  // S4 TV outline that grows and we fly into

  if(t<19.7||t>25.05)return;
  const a=P(t,19.75,20.4);const grow=lerp(.35,1.0,P(t,19.8,23.2,E.out));const fly=P(t,24.15,24.95,E.inout);const s=grow*(1+3.4*fly*fly);

  ctx.save();ctx.globalAlpha=a;
  const sg=ctx.createRadialGradient(W/2,540,10,W/2,540,Math.max(w,h)*.7);sg.addColorStop(0,'rgba(77,163,255,.32)');sg.addColorStop(1,'rgba(31,111,229,.06)');
  ctx.fillStyle=sg;ctx.fillRect(x,y,w,h);
  ctx.strokeStyle='#4DA3FF';ctx.lineWidth=Math.max(3,8*s);ctx.shadowColor='#2B83F6';ctx.shadowBlur=40;ctx.strokeRect(x,y,w,h);ctx.shadowBlur=0;

  ctx.restore();
}

const FLASH=[[4.6,.95,.6],[10.6,.55,.35],[24.92,1,.55],[35.95,.75,.7],[47.66,.6,.5],[30.0,.0,.1]];

  $('credit').style.opacity=(OVERLAY&&t>=FOOT0&&t<FOOT1)?P(t,4.9,5.5):0;
  flash(t); glitch(t);
  const sh=shake(t);if(sh>0&&$('glitch').style.opacity==0){const r=rng(Math.floor(t*30));$('stage').style.transform=`translate(${(r()-.5)*14*sh}px,${(r()-.5)*10*sh}px)`;}
  else if($('glitch').style.opacity==0)$('stage').style.transform='';
};
window.ready=Promise.all([document.fonts.ready,...[...document.images].map(i=>i.decode().catch(()=>{}))]);
if(q.get('t')){window.ready.then(()=>renderAt(parseFloat(q.get('t'))));}
</script>
