<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;600;700;800&family=Noto+Serif+Bengali:wght@700;900&family=Montserrat:wght@600;800;900&family=Playfair+Display:ital@1&family=Bebas+Neue&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:transparent}
body{font-family:'Anek Bangla',sans-serif;color:#fff;position:relative}
.abs{position:absolute}.hide{display:none!important}
:root{--gold:#ffd23f;--red:#e0313b}
#bandLine1,#bandLine2{left:0;width:1080px;height:3px;background:linear-gradient(90deg,transparent,rgba(255,210,63,.9),transparent)}
#bandLine1{top:458px}#bandLine2{top:1459px}
#logo{left:0;width:1080px;top:96px;display:flex;justify-content:center;align-items:center;gap:16px}
#logo img.i{height:74px;filter:drop-shadow(0 0 14px rgba(120,180,255,.7))}
#logo img.w{width:330px}
#kick{left:0;width:1080px;top:205px;text-align:center;font-family:'Montserrat';font-weight:800;font-size:26px;letter-spacing:10px;color:#ddd}
#head{left:40px;width:1000px;top:248px;text-align:center;font-family:'Noto Serif Bengali';font-weight:900;font-size:60px;line-height:1.2;text-shadow:0 6px 24px rgba(0,0,0,.8)}
#head .n{font-family:'Bebas Neue';font-weight:400;font-size:96px;color:var(--gold);line-height:1;display:block}
#head .s{font-family:'Anek Bangla';font-weight:700;font-size:32px;color:#eee;display:block;margin-top:2px}
#pres{left:0;top:0;width:1080px;height:1920px;background:rgba(0,0,0,.55)}
#presW{left:240px;top:880px;width:600px}
#presT{left:0;width:1080px;top:990px;text-align:center;font-family:'Playfair Display';font-style:italic;font-size:44px;color:#ccc}
#ttl{left:0;top:0;width:1080px;height:1920px;background:rgba(0,0,0,.35)}
#ttlA{left:0;width:1080px;top:780px;text-align:center;font-family:'Montserrat';font-weight:600;font-size:40px;letter-spacing:16px;color:#eee}
#ttlB{left:0;width:1080px;top:830px;text-align:center;font-family:'Bebas Neue';font-size:300px;line-height:1;text-shadow:0 10px 40px rgba(0,0,0,.7)}
#cap{left:70px;width:940px;top:1500px;text-align:center;font-size:66px;font-weight:800;line-height:1.3}
#cap span{display:inline-block;margin:0 9px;text-shadow:0 0 2px #000,0 4px 14px rgba(0,0,0,.95),0 0 30px rgba(0,0,0,.6);-webkit-text-stroke:2px rgba(0,0,0,.65);paint-order:stroke fill}
#cap span.on{color:var(--gold);transform:scale(1.08)}
.card{position:absolute;left:90px;width:900px;top:1500px;padding:26px 32px;background:rgba(7,9,13,.82);border:2px solid #3d8bf5;border-radius:24px;display:flex;gap:26px;align-items:center;box-shadow:0 0 40px rgba(61,139,245,.35)}
.card .ic{width:104px;height:104px;flex:none;border-radius:24px;background:linear-gradient(145deg,#4aa0ff,#1f5fd6);display:flex;align-items:center;justify-content:center}
.card.wa .ic{background:linear-gradient(145deg,#3ee07a,#14a34a)}
.card .k{font-size:30px;color:#8cc0ff;font-weight:600}
.card .v{font-size:46px;font-weight:800;line-height:1.25}
.card .v.u{font-family:'Bebas Neue';font-weight:400;font-size:70px;letter-spacing:2px;line-height:1}
.card .v.n{font-family:'Bebas Neue';font-weight:400;font-size:96px;letter-spacing:5px;line-height:1}
#fin{left:0;width:1080px;top:1490px;display:flex;flex-direction:column;align-items:center;gap:14px}
.fr{display:flex;align-items:center;gap:16px;font-size:36px;font-weight:700;padding:10px 24px;background:rgba(7,9,13,.82);border-radius:14px;border:1px solid rgba(61,139,245,.7);white-space:nowrap}
.fr .i{width:44px;height:44px;border-radius:11px;background:#3d8bf5;display:flex;align-items:center;justify-content:center}.fr.wa .i{background:#1fbf5c}
#flash{left:0;top:0;width:1080px;height:1920px;background:#fff;opacity:0}
#black{left:0;top:0;width:1080px;height:1920px;background:#000;opacity:0}
</style></head><body>
<div id="bandLine1" class="abs"></div><div id="bandLine2" class="abs"></div>
<div id="logo" class="abs"><img class="i" src="../inv/brand/icon_white.png"><img class="w" src="../inv/brand/wordmark_clean.png"></div>
<div id="kick" class="abs">THE STORY OF GTA VI</div>
<div id="head" class="abs"></div>
<div id="cap" class="abs"></div>
<div id="cA" class="card hide"><div class="ic"><svg width="56" height="56" viewBox="0 0 24 24"><path fill="#fff" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg></div><div><div class="k">ঠিকানা</div><div class="v">রানীর বাজার, IFIC ব্যাংক বিল্ডিং<br>৪র্থ তলা, কুমিল্লা</div></div></div>
<div id="cU" class="card hide"><div class="ic"><svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.8 2.9 2.8 16.1 0 19M12 2.5c-2.8 2.9-2.8 16.1 0 19"/></svg></div><div><div class="k">অনলাইন বুকিং</div><div class="v u">champion.gemten.com.bd</div></div></div>
<div id="cW" class="card wa hide"><div class="ic"><svg width="60" height="60" viewBox="0 0 24 24"><path fill="#fff" d="M12 2.2A9.8 9.8 0 0 0 3.6 17l-1.3 4.8 4.9-1.3A9.8 9.8 0 1 0 12 2.2z"/></svg></div><div><div class="k">হোয়াটসঅ্যাপ</div><div class="v n">01603-754074</div></div></div>
<div id="fin" class="abs hide">
  <div class="fr"><div class="i"><svg width="26" height="26" viewBox="0 0 24 24"><path fill="#fff" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg></div>রানীর বাজার, IFIC ব্যাংক বিল্ডিং, ৪র্থ তলা</div>
  <div class="fr"><div class="i"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.8 2.9 2.8 16.1 0 19M12 2.5c-2.8 2.9-2.8 16.1 0 19"/></svg></div>champion.gemten.com.bd</div>
  <div class="fr wa"><div class="i"><svg width="26" height="26" viewBox="0 0 24 24"><path fill="#fff" d="M12 2.2A9.8 9.8 0 0 0 3.6 17l-1.3 4.8 4.9-1.3A9.8 9.8 0 1 0 12 2.2z"/></svg></div>WhatsApp: 01603-754074</div></div>
<div id="ttl" class="abs hide"><div id="ttlA" class="abs">THE STORY OF</div><div id="ttlB" class="abs">GTA VI</div></div>
<div id="pres" class="abs hide"><img id="presW" class="abs" src="../inv/brand/wordmark_clean.png"><div id="presT" class="abs">Presents</div></div>
<div id="flash" class="abs"></div><div id="black" class="abs"></div>
<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), P=(t,a,b)=>clamp((t-a)/(b-a)), eo=x=>1-Math.pow(1-x,3);
const BN='০১২৩৪৫৬৭৮৯', bn=n=>String(n).replace(/\d/g,d=>BN[d]);
function vis(t,a,b,fi=.3,fo=.3){if(t<a||t>b)return 0;return Math.min(fi?clamp((t-a)/fi):1,fo?clamp((b-t)/fo):1)}
function show(el,on){el.classList.toggle('hide',!on)}
let TL,L={};
async function init(){TL=await (await fetch('timeline.json')).json();for(const l of TL.lines)L[l.id]=l;await document.fonts.ready}
const S=id=>L[id].start, E=id=>L[id].start+L[id].dur;
function heads(){return [
  [S('r1')-.2,E('r2')+.3,'১৩ বছরের অপেক্ষা',null,null],
  [S('r3')-.2,E('r3')+.3,'GTA V',21,'কোটি+ কপি বিক্রি'],
  [S('r4')-.2,E('r4')+.3,'প্রথম ট্রেলার',9,'কোটি+ ভিউ · ২৪ ঘণ্টায়'],
  [S('r5')-.2,E('r5')+.3,'লিওনিডা',null,'ভাইস সিটি · জলাভূমি · দ্বীপপুঞ্জ'],
  [S('r6')-.2,E('r6')+.3,'লুসিয়া & জেসন',null,'দুই অপরাধী'],
  [S('r7')-.2,E('r7')+.3,'১৯ নভেম্বর ২০২৬',379,'কোটি ডলার · প্রথম দিন*'],
  [S('r8')-.2,E('r8')+.4,'মেটাক্রিটিক স্কোর',99,null],
  [S('r9')-.3,TL.total,'চ্যাম্পিয়ন গেমিং জোন',null,'লাইভ খেলুন GTA VI · বড় স্ক্রিনে PS5']]}
function render(t){
  const f=Math.round(t*30);
  // presents
  {const o=t<1.75;show($('pres'),o);if(o){const v=Math.min(P(t,.05,.45),1-P(t,1.35,1.7));$('presW').style.opacity=v;$('presT').style.opacity=v*P(t,.35,.7);$('presW').style.filter=`blur(${(1-P(t,.05,.45))*8}px)`}}
  // title drop
  const T0=E('r2')+.15,T1=S('r3')-.05;
  {const o=t>=T0&&t<T1;show($('ttl'),o);if(o){const k=eo(P(t,T0,T0+.7));$('ttlB').style.filter=`blur(${(1-k)*24+P(t,T1-.3,T1)*16}px)`;$('ttlB').style.letterSpacing=(30-22*k)+'px';
    const out=1-P(t,T1-.3,T1);$('ttlB').style.opacity=Math.min(1,P(t,T0,T0+.2))*out;$('ttlA').style.opacity=P(t,T0+.4,T0+.8)*out;$('ttl').style.opacity=out}}
  // header (top zone)
  let hd=null;for(const h of heads())if(t>=h[0]&&t<h[1])hd=h;
  const hdOn=!!hd&&!(t>=T0&&t<T1); $('head').style.display=hdOn?'block':'none';
  if(hdOn){const [a,b,txt,n,sub]=hd;const v=vis(t,a,b,.3,.3);const k=eo(P(t,a,a+.7));let h=txt;
    if(n!=null){const val=Math.round(n*eo(P(t,a+.2,a+1.4)));h=`<span class="n">${n===379?'$':''}${bn(val)}${n===99?'/১০০':''}</span>`+txt}
    $('head').innerHTML=h+(sub?`<span class="s">${sub}</span>`:'');$('head').style.opacity=v;$('head').style.transform=`translateY(${(1-k)*30}px)`;$('head').style.filter=`blur(${(1-k)*10}px)`}
  $('kick').style.opacity=t>1.75&&!(t>=T0&&t<T1)&&t<S('r9')-.3?1:0;
  $('logo').style.opacity=P(t,1.6,2.0);
  // captions (word highlight); promo lines use cards instead
  let cap='';
  const cardLines={r10:1,r11:1,r12:1,r13:1};
  for(const l of TL.lines){ if(cardLines[l.id])continue; if(t>=l.start-.05&&t<=l.start+l.dur+.25){
      // chunks of up to 4 words
      const W=l.words, T=l.wt; let ci=0; for(let i=0;i<W.length;i++) if(t>=T[i]) ci=i;
      const c0=Math.floor(ci/4)*4; const ch=W.slice(c0,c0+4);
      cap=ch.map((w,j)=>`<span class="${(c0+j)===ci?'on':''}">${w}</span>`).join(' '); break; } }
  $('cap').innerHTML=cap;
  // promo cards
  const card=(el,a,b)=>{const v=vis(t,a,b,.3,.25);show(el,v>0);if(v){el.style.opacity=v;el.style.transform=`translateY(${(1-eo(P(t,a,a+.4)))*50}px)`}};
  card($('cA'),S('r10')-.15,S('r11')-.2);card($('cU'),S('r11')-.15,S('r12')-.2);card($('cW'),S('r12')-.15,S('r13')-.25);
  {const v=t>=S('r13')-.2;show($('fin'),v);if(v){$('fin').style.opacity=P(t,S('r13')-.2,S('r13')+.3)}}
  // promo: bigger logo in the top zone
  {const k=eo(P(t,S('r9')-.4,S('r9')+.3));$('logo').style.top=(96+24*k)+'px';$('logo').querySelector('img.i').style.height=(74+56*k)+'px';$('logo').querySelector('img.w').style.width=(330+190*k)+'px'}
  // flashes at section changes
  let fl=0;for(const c of [1.75,T0,S('r3')-.1,S('r5')-.1,S('r7')-.1,S('r9')-.3])fl=Math.max(fl,vis(t,c-.02,c+.25,.02,.23)*.7);
  $('flash').style.opacity=fl;
  $('black').style.opacity=Math.max(1-P(t,0,.25),P(t,TL.total-.6,TL.total));
}
window.init=init;window.render=render;
</script></body></html>
