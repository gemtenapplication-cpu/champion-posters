<html><head><meta charset="utf-8">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow:hidden;background:transparent}
body{font-family:'Anek Bangla',sans-serif;color:#fff;position:relative}
body.h{width:1920px;height:1080px} body.v{width:1080px;height:1920px}
.abs{position:absolute}.hide{display:none!important}.full{left:0;top:0;width:100%;height:100%}
:root{--blue:#2f7cf6;--blue2:#1aa3ff;--navy:#0b1d4f;--ink:#061230}

.glow{border-radius:50%;filter:blur(80px);opacity:.55}

#url b{color:#8a94a8;font-weight:500}
#vp{position:absolute;left:0;overflow:hidden}
#vp img{position:absolute;left:0;top:0;transform-origin:0 0;image-rendering:auto}
#hlL{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.ring{position:absolute;border-radius:14px;border:4px solid #2f7cf6;box-shadow:0 0 0 4px rgba(47,124,246,.25),0 0 30px rgba(47,124,246,.6)}
.spot{position:absolute;border-radius:14px;box-shadow:0 0 0 3000px rgba(4,10,30,.42)}
.lbl{position:absolute;white-space:nowrap;background:linear-gradient(180deg,#3d8bff,#1f66e0);color:#fff;font-weight:800;border-radius:14px;padding:6px 20px 8px;box-shadow:0 10px 26px rgba(10,40,120,.45);line-height:1.25}
.lbl::after{content:'';position:absolute;left:var(--ax,30px);width:16px;height:16px;background:#2a74ee;transform:rotate(45deg)}
.lbl.up::after{bottom:-7px}.lbl.dn::after{top:-7px;background:#3d8bff}
#cur{width:40px;height:40px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}
.rip{position:absolute;border-radius:50%;border:4px solid #2f7cf6}
/* header */
#hdr{display:flex;align-items:center;gap:22px}
#hdr .num{font-family:'Anton';color:#fff;background:linear-gradient(180deg,#3d8bff,#1f5fd6);border-radius:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(31,95,214,.5)}
#hdr .t1{font-family:'Montserrat';font-weight:900;letter-spacing:3px;line-height:1}
#hdr .t2{font-weight:700;color:#bcd3ff;line-height:1.2}
#wm{display:flex;align-items:center;gap:12px}
/* subtitles */
#sub{text-align:center}
#sub span{display:inline-block;background:rgba(3,9,28,.82);border:1px solid rgba(120,170,255,.25);border-radius:14px;padding:6px 24px 10px;font-weight:700;line-height:1.35;max-width:1700px}
#cap{text-align:center;font-weight:800;line-height:1.3}
#cap span{display:inline-block;margin:0 8px;text-shadow:0 0 2px #000,0 4px 14px rgba(0,0,0,.95);-webkit-text-stroke:2px rgba(0,0,0,.55);paint-order:stroke fill}
#cap span.on{color:#7fc0ff;-webkit-text-stroke:2px rgba(0,20,60,.7);transform:scale(1.08)}

.bdg{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.bdg .b{display:flex;align-items:center;gap:12px;padding:10px 24px;border-radius:40px;background:rgba(6,14,40,.92);border:2px solid #4d94ff;font-weight:800;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 24px rgba(47,124,246,.35)}
.bdg .b i{font-style:normal;font-family:'Montserrat';font-weight:900;color:#7fc0ff}
.bdg .ar{font-family:'Montserrat';font-weight:900;color:#7fc0ff;align-self:center}
/* mascot */
#masc img{position:absolute;left:0;top:0;width:100%}

.kinB{font-family:'Noto Serif Bengali';font-weight:900;text-align:center;text-shadow:0 6px 24px rgba(0,0,0,.85)}
.card{position:absolute;border-radius:26px;background:rgba(8,18,48,.9);border:2px solid rgba(110,165,255,.6);box-shadow:0 0 40px rgba(47,124,246,.25),0 20px 50px rgba(0,0,0,.5)}

.card2 .ic{width:110px;height:110px;flex:none;border-radius:26px;background:linear-gradient(145deg,#4aa0ff,#1f5fd6);display:flex;align-items:center;justify-content:center}
.card2.wa .ic{background:linear-gradient(145deg,#3ee07a,#14a34a)}
.card2 .k{font-size:30px;color:#cfe0ff;font-weight:700}.card2 .v{font-size:50px;font-weight:800;line-height:1.25}
.card2 .v.u{font-family:'Bebas Neue';font-weight:400;font-size:80px;letter-spacing:2px;line-height:1}
.card2 .v.n{font-family:'Bebas Neue';font-weight:400;font-size:104px;letter-spacing:5px;line-height:1}
#fin{display:flex;flex-direction:column;align-items:center;gap:14px}
#finB{font-family:'Anton';letter-spacing:2px;background:linear-gradient(180deg,#fff,#9ec4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.fr{display:flex;align-items:center;gap:16px;font-weight:800;padding:10px 26px;background:rgba(6,12,30,.86);border-radius:14px;border:1px solid rgba(120,170,255,.7);white-space:nowrap}
.fr .i{width:46px;height:46px;border-radius:11px;background:var(--blue);display:flex;align-items:center;justify-content:center}.fr.wa .i{background:#1fbf5c}
#lg img{position:absolute}
#flash{background:#fff;opacity:0}#black{background:#000;opacity:0}
</style></head><body>

<script>

// ---------- camera ----------

  let s=Math.min(vw/r[2],vh/r[3])*pad;s=Math.min(s,V?2.6:2.2);let cx=r[0]+r[2]/2,cy=r[1]+r[3]/2;

  const ent=DATA.winIn?eo(P(t,T(DATA.winIn[0]),T(DATA.winIn[0])+.7)):1;W.style.transform=`translateY(${(1-winOp)*40}px) scale(${.96+.04*winOp})`;
