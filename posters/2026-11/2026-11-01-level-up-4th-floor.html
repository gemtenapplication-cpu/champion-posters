<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Orbitron;font-weight:900;src:url(../../node_modules/@fontsource/orbitron/files/orbitron-latin-900-normal.woff2)}
@font-face{font-family:Orbitron;font-weight:700;src:url(../../node_modules/@fontsource/orbitron/files/orbitron-latin-700-normal.woff2)}
@font-face{font-family:Rajdhani;font-weight:700;src:url(../../node_modules/@fontsource/rajdhani/files/rajdhani-latin-700-normal.woff2)}
@font-face{font-family:Rajdhani;font-weight:600;src:url(../../node_modules/@fontsource/rajdhani/files/rajdhani-latin-600-normal.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1350px;overflow:hidden}
.p{position:relative;width:1080px;height:1350px;background:#F4F8FF;font-family:Rajdhani,sans-serif;color:#0B0B0C;overflow:hidden}
.grid{position:absolute;inset:0;background-image:linear-gradient(#2B83F614 2px,transparent 2px),linear-gradient(90deg,#2B83F614 2px,transparent 2px);background-size:54px 54px}
.logo{position:absolute;top:60px;left:70px;width:440px}
.tag{position:absolute;top:84px;right:70px;font-family:Orbitron;font-weight:700;font-size:18px;letter-spacing:5px;color:#1F6FE5;border:2px solid #2B83F6;border-radius:40px;padding:10px 20px;background:#fff}
h1{position:absolute;top:200px;left:70px;font-family:Orbitron;font-weight:900;font-size:76px;line-height:1.08;letter-spacing:1px}
h1 em{font-style:normal;color:#2B83F6}
.lead{position:absolute;top:470px;left:70px;width:470px;font-weight:700;font-size:36px;line-height:1.2}
.lead span{color:#1F6FE5}
/* lift panel */
.lift{position:absolute;top:585px;left:70px;width:420px;background:#0B0B0C;border-radius:28px;padding:30px 30px 34px;box-shadow:10px 10px 0 #2B83F6}
.lift .disp{background:#111C2E;border-radius:14px;height:110px;display:flex;align-items:center;justify-content:center;gap:18px;font-family:Orbitron;font-weight:900;color:#4DA3FF;font-size:70px}
.lift .disp small{font-size:24px;letter-spacing:4px;color:#fff;font-weight:700}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:26px}
.b{height:86px;border-radius:50%;width:86px;margin:0 auto;border:4px solid #2C3442;display:flex;align-items:center;justify-content:center;font-family:Orbitron;font-weight:900;font-size:36px;color:#5B6576}
.b.on{border-color:#4DA3FF;color:#fff;background:radial-gradient(circle,#2B83F6,#1F6FE5);box-shadow:0 0 0 6px #2B83F640,0 0 30px #4DA3FF}
/* building */
.bld{position:absolute;top:200px;right:70px;width:420px;height:760px}
.roof{height:30px;background:#0B0B0C;border-radius:10px 10px 0 0}
.fl{height:170px;background:#fff;border:3px solid #0B0B0C;border-top:none;position:relative;display:flex;align-items:center;padding:0 22px;gap:14px}
.fl .n{font-family:Orbitron;font-weight:900;font-size:26px;color:#9AA7BA;width:46px}
.win{flex:1;height:96px;background:#E4EEFF;border-radius:8px}
.fl.hot{background:linear-gradient(90deg,#1F6FE5,#2B83F6 60%,#4DA3FF);border-color:#0B0B0C}
.fl.hot .n{color:#fff}
.scr{flex:1;height:100px;background:#0B0B0C;border:4px solid #fff;border-radius:8px;position:relative;display:flex;align-items:center;justify-content:center}
.scr svg{display:block}
.pin{position:absolute;top:-56px;right:-18px;background:#0B0B0C;color:#fff;font-family:Orbitron;font-weight:700;font-size:20px;letter-spacing:3px;padding:10px 16px;border-radius:12px}
.pin:after{content:"";position:absolute;left:30px;bottom:-12px;border:12px solid transparent;border-bottom:none;border-top-color:#0B0B0C}
.ground{height:22px;background:#0B0B0C;margin:0 -30px;border-radius:6px}
.feat{position:absolute;top:1012px;left:70px;right:70px;display:flex;gap:18px}
.f{flex:1;background:#fff;border:2px solid #D6E6FF;border-radius:18px;padding:14px 12px;text-align:center}
.f b{display:block;font-family:Orbitron;font-weight:900;font-size:36px;color:#2B83F6}
.f span{font-weight:700;font-size:22px;letter-spacing:1px;text-transform:uppercase}
.soon{position:absolute;top:1128px;left:0;right:0;text-align:center;font-family:Orbitron;font-weight:700;font-size:20px;letter-spacing:8px;color:#1F6FE5}
.bar{position:absolute;left:0;right:0;bottom:0;height:170px;background:#0B0B0C;color:#fff;display:flex;align-items:center;padding:0 70px;justify-content:space-between}
.loc{font-weight:600;font-size:27px;line-height:1.3}
.loc b{display:block;font-family:Orbitron;font-weight:700;font-size:22px;letter-spacing:4px;color:#4DA3FF;margin-bottom:6px}
.cta{background:#2B83F6;border-radius:14px;padding:16px 26px;text-align:center}
.cta b{display:block;font-family:Orbitron;font-weight:900;font-size:26px;letter-spacing:3px}
.cta span{font-weight:600;font-size:22px}
</style></head><body>
<div class="p">
  <div class="grid"></div>
  <img class="logo" src="../../brand/logo-color-on-light.png">
  <div class="tag">FIND US</div>
  <h1>LEVEL<br>UP TO<br><em>FLOOR 4.</em></h1>
  <div class="lead">Your new gaming spot is <span>in Ranir Bazar, Cumilla.</span></div>
  <div class="lift">
    <div class="disp">&#9650; 4 <small>CHAMPION</small></div>
    <div class="btns">
      <div class="b">1</div><div class="b">2</div>
      <div class="b">3</div><div class="b on">4</div>
    </div>
  </div>
  <div class="bld">
    <div class="roof"></div>
    <div class="fl hot">
      <div class="pin">YOU PLAY HERE</div>
      <div class="n">4</div>
      <div class="scr"><svg width="70" height="40" viewBox="0 0 70 40"><rect x="2" y="6" width="66" height="30" rx="15" fill="#4DA3FF"/><circle cx="20" cy="21" r="5" fill="#0B0B0C"/><circle cx="50" cy="21" r="5" fill="#0B0B0C"/></svg></div>
      <div class="scr"><svg width="70" height="40" viewBox="0 0 70 40"><rect x="2" y="6" width="66" height="30" rx="15" fill="#4DA3FF"/><circle cx="20" cy="21" r="5" fill="#0B0B0C"/><circle cx="50" cy="21" r="5" fill="#0B0B0C"/></svg></div>
    </div>
    <div class="fl"><div class="n">3</div><div class="win"></div><div class="win"></div></div>
    <div class="fl"><div class="n">2</div><div class="win"></div><div class="win"></div></div>
    <div class="fl"><div class="n">1</div><div class="win"></div><div class="win"></div></div>
    <div class="ground"></div>
  </div>
  <div class="feat">
    <div class="f"><b>2</b><span>PS5 Stations</span></div>
    <div class="f"><b>55"</b><span>Screens</span></div>
    <div class="f"><b>30"</b><span>Gaming PC</span></div>
  </div>
  <div class="soon">OPENING SOON &middot; PLAY + CONNECT + WIN</div>
  <div class="bar">
    <div class="loc"><b>IFIC BANK BUILDING</b>4th Floor, Ranir Bazar<br>Cumilla</div>
    <div class="cta"><b>BOOK ONLINE</b><span>champion.gemten.com.bd</span></div>
  </div>
</div>
</body></html>
